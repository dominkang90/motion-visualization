<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="모션시각화: 문서를 content.json으로 정리하면 움직이는 매거진 HTML이 만들어집니다">
  <style>
    .t{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
    .flow{fill:none;stroke:#141413;stroke-width:3;stroke-dasharray:8 10;animation:d 1.1s linear infinite}
    .bob{animation:b 3.6s ease-in-out infinite}
    .bob2{animation:b 3.6s ease-in-out infinite;animation-delay:1.2s}
    .pop{animation:p 4.8s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
    .c1{animation:c 6s steps(1) infinite}
    @keyframes d{to{stroke-dashoffset:-36}}
    @keyframes b{50%{transform:translateY(-10px)}}
    @keyframes p{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
    @keyframes c{0%{fill:#D97757}25%{fill:#2F6FEB}50%{fill:#E4572E}75%{fill:#4ADE80}}
  </style>
  <rect width="1200" height="420" rx="28" fill="#F4F0E8"/>
  <circle cx="1040" cy="70" r="160" fill="#ECE6DA"/>
  <text x="64" y="118" class="t" font-size="64" font-weight="900" fill="#141413" letter-spacing="-2">모션시각화</text>
  <text x="66" y="160" class="t" font-size="22" fill="#3d3a35">문서 한 편을 움직이는 매거진으로</text>
  <text x="66" y="192" class="t" font-size="16" fill="#77716a">AI는 내용만 정리 · 디자인·모션·점검은 스킬이</text>

  <!-- doc -->
  <g transform="translate(70 230)"><g class="bob">
    <rect width="150" height="160" rx="12" fill="#fff" stroke="#141413" stroke-width="3"/>
    <path d="M24 34h100M24 60h100M24 86h76M24 112h100M24 138h56" stroke="#B8B0A2" stroke-width="8" stroke-linecap="round"/>
  </g></g>
  <text x="145" y="412" text-anchor="middle" class="t" font-size="15" font-weight="700" fill="#141413">원본 문서</text>
  <path class="flow" d="M235 310 C 290 260, 330 360, 385 310"/>

  <!-- json -->
  <g transform="translate(400 250)"><g class="pop">
    <rect width="200" height="120" rx="16" fill="#141413"/>
    <text x="22" y="44" font-family="Consolas,Menlo,monospace" font-size="18" fill="#4ADE80">{ "sections":</text>
    <text x="40" y="74" font-family="Consolas,Menlo,monospace" font-size="18" fill="#F4F0E8">[ 결론, 단계,</text>
    <text x="40" y="100" font-family="Consolas,Menlo,monospace" font-size="18" fill="#F4F0E8">  질문 … ] }</text>
  </g></g>
  <text x="500" y="400" text-anchor="middle" class="t" font-size="15" font-weight="700" fill="#141413">content.json · AI가 쓰는 유일한 것</text>
  <path class="flow" d="M615 310 C 670 260, 700 360, 755 310"/>

  <!-- build chip -->
  <g transform="translate(640 220)"><rect width="96" height="34" rx="17" fill="#fff" stroke="#141413" stroke-width="2"/><text x="48" y="23" text-anchor="middle" font-family="Consolas,monospace" font-size="15" font-weight="700" fill="#141413">build.py</text></g>

  <!-- magazine -->
  <g transform="translate(775 205)"><g class="bob2">
    <rect width="190" height="200" rx="16" fill="#fff" stroke="#141413" stroke-width="3"/>
    <rect x="18" y="18" width="154" height="58" rx="10" class="c1" fill="#D97757"/>
    <rect x="18" y="90" width="100" height="12" rx="6" fill="#141413"/>
    <rect x="18" y="112" width="154" height="9" rx="4" fill="#D8D1C3"/>
    <rect x="18" y="128" width="124" height="9" rx="4" fill="#D8D1C3"/>
    <rect x="18" y="150" width="70" height="34" rx="8" fill="#D6F5E1"/>
    <rect x="102" y="150" width="70" height="34" rx="8" fill="#12C95A"/>
  </g></g>
  <text x="870" y="420" text-anchor="middle" class="t" font-size="15" font-weight="700" fill="#141413" dy="-6">매거진 HTML</text>

  <!-- check -->
  <g transform="translate(1000 250)">
    <circle cx="50" cy="50" r="50" fill="#141413"/>
    <path d="M28 52l15 15 30-32" fill="none" stroke="#4ADE80" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="1050" y="380" text-anchor="middle" class="t" font-size="15" font-weight="700" fill="#141413">check.py 자동 점검</text>
  <path class="flow" d="M975 300 L 998 300"/>
</svg>
